<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vibra</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--c:#8b5cf6;--b1:#16102b;--b2:#0a1226;--t:#f3f0ff;--m:#f3f0ff99;--g:#ffffff14}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 'Instrument Sans',system-ui,sans-serif;color:var(--t);min-height:100vh;background:radial-gradient(900px 600px at 80% -10%,color-mix(in srgb,var(--c) 40%,transparent),transparent),linear-gradient(160deg,var(--b1),var(--b2)) fixed}
h1,h2,h3,.logo{font-family:'Bricolage Grotesque',sans-serif}
a{color:inherit;text-decoration:none}small{color:var(--m)}
header{display:flex;gap:14px;align-items:center;padding:14px 22px}.sp{flex:1}.logo{font-weight:800;font-size:20px}
button,input,select{font:inherit;color:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--g)}
select option{color:#000}input{flex:1;min-width:0;outline:1px solid #ffffff24}
input[type=color]{flex:none;width:52px;padding:2px;height:42px}
button{cursor:pointer;background:var(--c);font-weight:600}button.ghost{background:var(--g)}
:focus-visible{outline:2px solid var(--c);outline-offset:2px}
main{max-width:1180px;margin:0 auto;padding:6px 22px 40px}
.row{display:flex;gap:8px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{display:block;border-radius:16px;overflow:hidden;background:#1b1730;border:1px solid #ffffff14}.card:hover{border-color:var(--c)}
.bn{aspect-ratio:16/6;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 55%,#000),var(--c)) center/cover;display:grid;place-items:center;font-size:44px}.bn span{opacity:.5}
.ci{display:flex;gap:12px;align-items:flex-end;padding:0 14px;margin-top:-28px}.ci>div:last-child{min-width:0;padding-bottom:2px}.ci h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ra{width:58px;height:58px;border-radius:50%;flex:none;border:3px solid #1b1730;background:color-mix(in srgb,var(--c) 40%,#1b1730) center/cover;display:grid;place-items:center;font-size:26px}
.ow{display:flex;gap:6px;align-items:center}.ua{position:relative;overflow:hidden;width:22px;height:22px;border-radius:50%;background:#ffffff2e;display:grid;place-items:center;font-size:11px;flex:none}.ua img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.st{padding:10px 14px 14px;color:var(--m);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl{padding:10px 14px;border-radius:10px;background:var(--g);cursor:pointer;font-weight:600}
.box{max-width:340px;margin:14vh auto;display:grid;gap:12px;text-align:center}.box h1{font-size:40px}.err{color:#ff9aa8;min-height:1.5em}
.rm{display:grid;grid-template-columns:1fr 380px;gap:22px;align-items:start}@media(max-width:860px){.rm{grid-template-columns:1fr}}
.pl{aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000}.pl iframe{width:100%;height:100%;pointer-events:none}
.np{display:flex;gap:14px;align-items:center;margin:14px 0}.np>div:nth-child(2){flex:1;min-width:0}
.disc{width:68px;height:68px;border-radius:50%;flex:none;background:radial-gradient(circle,#0a0a0a 0 6%,var(--c) 7% 30%,#151515 31% 100%);box-shadow:0 0 0 2px #ffffff18}
.spin{animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(1turn)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
.ctl{display:flex;gap:6px;align-items:center}.ctl button{background:var(--g);padding:8px 12px}.ctl input{width:80px;padding:0;outline:0}
.pn{background:var(--g);border-radius:16px;padding:14px;margin-bottom:16px}.pn h3{margin-bottom:6px}
.rs,.qi{display:flex;gap:10px;align-items:center;padding:6px;border-radius:10px;cursor:pointer}.rs:hover,.qi:hover{background:var(--g)}
.rs img,.qi img{width:72px;aspect-ratio:16/9;object-fit:cover;border-radius:6px}.rs>div,.qi>span{flex:1;min-width:0}
.rs b,.qi>span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.qi.on{background:color-mix(in srgb,var(--c) 35%,transparent)}
.clock{font:800 30px 'Bricolage Grotesque';margin-bottom:8px}
.pn summary{cursor:pointer;font:600 17px 'Bricolage Grotesque'}#bd{width:100%;aspect-ratio:8/5;border-radius:12px;background:#0000004d;touch-action:none;cursor:crosshair;display:block}
#bgm{position:fixed;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);object-fit:cover;z-index:-1;filter:blur(16px) brightness(.5) saturate(1.1);pointer-events:none}
.chat{max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:6px;font-size:14px;overflow-wrap:anywhere}.chat b{color:var(--c)}
.qi[draggable]{cursor:grab}.row select{flex:1;min-width:0}.pn+.pn{margin-top:0}
aside.side{position:sticky;top:12px;height:calc(100vh - 84px);min-height:460px;display:flex;flex-direction:column;background:#ffffff10;border-radius:16px;overflow:hidden;backdrop-filter:blur(12px)}
@media(max-width:860px){aside.side{position:static;height:600px}}
.sh{display:flex;gap:12px;align-items:center;padding:14px 16px}.sh h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sh>div:last-child{min-width:0}
#sa{width:44px;height:44px;font-size:20px;border-color:transparent}
#so::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:#43d17a;margin-right:6px}
#tabs{display:flex;background:#00000040}
#tabs button{flex:1;position:relative;background:transparent;border-radius:0;padding:11px 0;font-size:18px;border-top:3px solid transparent}
#tabs button.on{border-top-color:var(--c);background:#ffffff12}
#cbd{position:absolute;top:5px;right:20%;background:var(--c);border-radius:9px;font:700 11px system-ui;padding:0 5px;font-style:normal}#cbd:empty{display:none}
.tp{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 14px}.tp[hidden]{display:none}
.tp .row{margin:0}.grow{flex:1;min-height:0;overflow:auto}.side .chat{max-height:none;flex:1;min-height:0}
.tp[data-p=ajustes]{overflow:auto}.tp .clock{font-size:46px;text-align:center;margin:26px 0 10px}
</style></head><body><div id="app"></div>
<script>
const BG={noche:['#16102b','#0a1226'],atardecer:['#3a1233','#1f1030'],bosque:['#0d2b24','#0b1e33'],oceano:['#06283d','#0a1022']};
let T=[],R=null,off=0,P=null,key='',ready=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const thumb=id=>`https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
const me=()=>localStorage.u;
async function api(p,o={}){
  const r=await fetch('/api/'+p,{method:o.method,headers:{'content-type':'application/json',authorization:'Bearer '+(localStorage.t||'')},body:o.body?JSON.stringify(o.body):undefined});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&p!=='login'){delete localStorage.t;route();throw'Sesión vencida'}
  if(!r.ok)throw j.error||'Error';return j}
const bar=()=>`<header><a href="#/" class="logo">🎧 Vibra</a><span id="rn"></span><span class="sp"></span><label title="Cambiar mi foto de perfil" style="cursor:pointer">${ua(me(),localStorage.av,1)}<input type="file" id="mf" accept="image/*" hidden></label><small>${esc(me()||'')}</small><button class="ghost" id="lo">Salir</button></header>`;
const ua=(n,v,f)=>`<span class="ua">${esc((n||'?')[0].toUpperCase())}${f||v?`<img src="/api/img/u/${encodeURIComponent(n)}?v=${v||0}" alt="" onerror="this.remove()">`:''}</span>`;
function shrink(file,w,h,q){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),k=Math.max(w/im.width,h/im.height),dw=im.width*k,dh=im.height*k;x.drawImage(im,(w-dw)/2,(h-dh)/2,dw,dh);ok(c.toDataURL('image/jpeg',q).split(',')[1])};im.onerror=()=>no('No pude leer esa imagen');im.src=URL.createObjectURL(file)})}
document.addEventListener('change',async e=>{if(e.target.id!=='mf')return;const f=e.target.files[0];if(!f)return;try{const r=await api('me/img',{method:'POST',body:{data:await shrink(f,160,160,.85)}});localStorage.av=r.v;route()}catch(x){alert(x)}});
document.addEventListener('click',e=>{if(e.target.id==='lo'){localStorage.clear();route()}});
function setBg(u){const o=document.getElementById('bgm');if(!u){if(o)o.remove();return}if(o&&o.dataset.u===u)return;if(o)o.remove();
  const v=/\.(mp4|webm|ogv)(\?|$)/i.test(u),e=document.createElement(v?'video':'img');e.id='bgm';e.dataset.u=u;
  if(v){e.muted=true;e.defaultMuted=true;e.loop=true;e.autoplay=true;e.playsInline=true;e.setAttribute('muted','')}
  e.onerror=()=>e.remove();e.src=u;document.body.prepend(e);if(v)e.play().catch(()=>{})}
function setTheme(c,bg){const s=document.documentElement.style,b=BG[bg]||BG.noche;s.setProperty('--c',c||'#8b5cf6');s.setProperty('--b1',b[0]);s.setProperty('--b2',b[1])}
function route(){T.forEach(clearInterval);T=[];setTheme();document.getElementById('bgm')?.remove();const h=location.hash;
  if(!localStorage.t)return login();if(h.startsWith('#/s/'))return room(h.slice(4));lobby()}
addEventListener('hashchange',route);route();

function login(){
  app.innerHTML=`<div class="box"><h1>Vibra</h1><small>Música en sala, solo para invitados</small><input id="lu" placeholder="Usuario" autocomplete="username"><input id="lp" type="password" placeholder="Contraseña" autocomplete="current-password"><button id="go">Entrar</button><div class="err" id="le"></div></div>`;
  const send=async()=>{try{const r=await api('login',{method:'POST',body:{u:lu.value.trim(),p:lp.value}});localStorage.t=r.t;localStorage.u=r.u;route()}catch(x){le.textContent=x}};
  go.onclick=send;lp.onkeydown=e=>{if(e.key==='Enter')send()}}

function lobby(){
  app.innerHTML=bar()+`<main><h2>Salas</h2><div class="row"><input id="nn" placeholder="Nombre de tu sala nueva"><button id="mk">Crear sala</button></div><div class="grid" id="gr"></div></main>`;
  mk.onclick=async()=>{if(!nn.value.trim())return;const r=await api('rooms',{method:'POST',body:{name:nn.value}});location.hash='#/s/'+r.id};
  const load=async()=>{try{const l=await api('rooms');gr.innerHTML=l.map(r=>`<a class="card" href="#/s/${r.id}" style="--c:${r.color}"><div class="bn"${r.ib?` style="background-image:url(/api/img/b/${r.id}?v=${r.ib})"`:''}>${r.ib?'':`<span>${r.emoji}</span>`}</div><div class="ci"><div class="ra"${r.ia?` style="background-image:url(/api/img/a/${r.id}?v=${r.ia})"`:''}>${r.ia?'':r.emoji}</div><div><h3>${esc(r.name)}</h3><div class="ow">${ua(r.owner,r.ou)}<small>${esc(r.owner)}, ${r.n} escuchando</small></div></div></div><div class="st">${r.now?'Suena: '+esc(r.now):'Sin música todavía'}</div></a>`).join('')||'<p>Todavía no hay salas. Crea la primera y comparte el ambiente.</p>'}catch(x){}};
  load();T.push(setInterval(load,4000))}

async function room(id){
  R=null;P=null;key='';ready=false;let L=[];
  app.innerHTML=bar()+`<main class="rm"><section><div class="pl"><div id="yt"></div></div>
  <div class="np"><div class="disc" id="dc"></div><div><h2 id="tt">Nada sonando</h2><small id="by">Busca una canción y dale clic</small></div>
  <div class="ctl"><button id="pv">⏮</button><button id="pp">⏯</button><button id="nx">⏭</button><input id="vol" type="range" min="0" max="100" value="70" aria-label="Volumen"></div></div>
  <div class="row"><input id="q" placeholder="Buscar música o pegar un enlace de YouTube"><button id="sb">Buscar</button></div><div id="res"></div></section>
  <aside class="side"><div class="sh"><div class="ra" id="sa"></div><div><h3 id="sn"></h3><small id="so"></small></div></div>
  <div id="tabs"><button data-t="chat" title="Chat" aria-label="Chat">💬<i id="cbd"></i></button><button data-t="cola" class="on" title="Cola" aria-label="Cola">☰</button><button data-t="pomo" title="Pomodoro" aria-label="Pomodoro">🍅</button><button data-t="pizarra" title="Pizarra" aria-label="Pizarra">🎨</button><button data-t="ajustes" title="Personalizar sala" aria-label="Personalizar sala">⚙️</button></div>
  <div class="tp" data-p="chat" hidden><div class="chat" id="cl"></div><div class="row"><input id="ci" maxlength="300" placeholder="Escribe un mensaje"><button class="ghost" id="mu"></button><button id="cs">Enviar</button></div></div>
  <div class="tp" data-p="cola"><small id="qn"></small><div id="ql" class="grow"><small>La cola está vacía</small></div><div class="row"><select id="pl"><option value="">Mis listas guardadas</option></select><button class="ghost" id="pa">Agregar</button><button class="ghost" id="pd" title="Borrar lista">🗑</button></div><button class="ghost" id="sv">Guardar cola como lista</button></div>
  <div class="tp" data-p="pomo" hidden><div class="clock" id="ck"></div><div class="row"><button id="pw">Enfocar 25 min</button><button class="ghost" id="pr">Descanso 5</button><button class="ghost" id="pi">Parar</button></div><small>El temporizador es compartido: todos en la sala ven el mismo tiempo.</small></div>
  <div class="tp" data-p="pizarra" hidden><div class="row"><input id="bc" type="color" value="#ffffff"><select id="bw"><option value="3">Fino</option><option value="7">Medio</option><option value="14">Grueso</option></select><button class="ghost" id="bx">Borrar todo</button></div><canvas id="bd" width="800" height="500"></canvas></div>
  <div class="tp" data-p="ajustes" hidden><div class="row"><input id="cn" placeholder="Nombre"><input id="cc" type="color" value="#8b5cf6"></div>
  <div class="row"><select id="ce">${['🎧','🌙','🔥','🌿','🚀','🪩','☕'].map(e=>`<option>${e}</option>`).join('')}</select><select id="cb">${Object.keys(BG).map(k=>`<option>${k}</option>`).join('')}</select></div><div class="row"><input id="bu" placeholder="Fondo: enlace directo a GIF o video (.gif .mp4 .webm)"></div>
  <div class="row"><label class="fl">Banner<input type="file" id="fb" accept="image/*" hidden></label><label class="fl">Imagen de sala<input type="file" id="fa" accept="image/*" hidden></label></div><button class="ghost" id="cd">Eliminar sala</button></div></aside></main>`;
  const act=async b=>{try{R=await api(`rooms/${id}/act`,{method:'POST',body:b});off=R.now-Date.now();paint();return null}catch(x){return String(x)}};
  const th=async()=>{await act({type:'theme',color:cc.value,emoji:ce.value,bg:cb.value,name:cn.value,bgm:bu.value.trim()});bu.value=R.bgm||''};
  pv.onclick=()=>act({type:'prev'});pp.onclick=()=>act({type:'toggle'});nx.onclick=()=>R&&act({type:'next',from:R.idx});
  vol.oninput=()=>ready&&P.setVolume(+vol.value);
  pw.onclick=()=>act({type:'pomo',mode:'work'});pr.onclick=()=>act({type:'pomo',mode:'rest'});pi.onclick=()=>act({type:'pomo',mode:'idle'});
  cc.onchange=ce.onchange=cb.onchange=cn.onchange=bu.onchange=th;
  cd.onclick=async()=>{if(confirm('¿Eliminar esta sala?')){try{await api(`rooms/${id}/del`,{method:'POST',body:{}});location.hash='#/'}catch(x){alert(x)}}};
  for(const [el,k,w,h,q] of [[fb,'b',640,240,.8],[fa,'a',160,160,.85]])el.onchange=async()=>{const f=el.files[0];if(!f)return;try{await api(`rooms/${id}/img`,{method:'POST',body:{k,data:await shrink(f,w,h,q)}});el.value='';await poll()}catch(x){alert(x)}};
  let tab='cola',seen=null,ping=null,ac;
  const beep=()=>{if(localStorage.mute==='1')return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(880,t);o.frequency.setValueAtTime(1175,t+.09);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.28);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.3)}catch(x){}};
  const paintMu=()=>{const m=localStorage.mute==='1';mu.textContent=m?'🔕':'🔔';mu.title=m?'Activar el sonido de mensajes':'Silenciar el sonido de mensajes'};
  mu.onclick=()=>{localStorage.mute=localStorage.mute==='1'?'0':'1';paintMu();beep()};paintMu();
  const sel=t=>{tab=t;document.querySelectorAll('.tp').forEach(p=>{p.hidden=p.dataset.p!==t});document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
    if(t==='chat'){const c=(R&&R.chat)||[];if(c.length)seen=c[c.length-1].ts;cbd.textContent='';cl.scrollTop=cl.scrollHeight;ci.focus()}};
  tabs.onclick=e=>{const b=e.target.closest('[data-t]');if(b)sel(b.dataset.t)};
  let drag=null,PL={};
  ql.ondragstart=e=>{const d=e.target.closest('[data-i]');if(d){drag=+d.dataset.i;e.dataTransfer.effectAllowed='move'}};
  ql.ondragover=e=>{e.preventDefault()};
  ql.ondrop=e=>{e.preventDefault();const d=e.target.closest('[data-i]');if(d&&drag!==null&&+d.dataset.i!==drag)act({type:'move',from:drag,to:+d.dataset.i});drag=null};
  const loadPL=async()=>{try{PL=await api('pls');pl.innerHTML='<option value="">Mis listas guardadas</option>'+Object.keys(PL).map(n=>`<option>${esc(n)}</option>`).join('')}catch(x){}};
  sv.onclick=async()=>{if(!R.queue.length){alert('La cola está vacía');return}const n=prompt('Nombre de la lista');if(!n||!n.trim())return;try{await api('pls',{method:'POST',body:{name:n.trim(),items:R.queue.map(x=>({id:x.id,title:x.title}))}});await loadPL();alert('Lista guardada')}catch(x){alert(x)}};
  pa.onclick=()=>{const a=PL[pl.value];if(a)act({type:'addmany',vs:a})};
  pd.onclick=async()=>{if(PL[pl.value]&&confirm('¿Borrar la lista "'+pl.value+'"?')){try{await api('pls/del',{method:'POST',body:{name:pl.value}});await loadPL()}catch(x){alert(x)}}};
  loadPL();
  const sendChat=()=>{const t=ci.value.trim();if(!t)return;ci.value='';act({type:'chat',t})};
  cs.onclick=sendChat;ci.onkeydown=e=>{if(e.key==='Enter')sendChat()};
  ql.onclick=e=>{const d=e.target.closest('[data-i]');if(d)act(e.target.dataset.x?{type:'rm',i:+d.dataset.i}:{type:'play',i:+d.dataset.i})};
  let bs=[],bv=0,cur=null,busy=false;
  const dS=s=>{const c=bd.getContext('2d'),[a,...r]=s.p;c.strokeStyle=s.c;c.lineWidth=s.w;c.lineCap=c.lineJoin='round';c.beginPath();c.moveTo(a[0]*800,a[1]*500);r.length?r.forEach(q=>c.lineTo(q[0]*800,q[1]*500)):c.lineTo(a[0]*800+.1,a[1]*500);c.stroke()};
  const pt=e=>{const r=bd.getBoundingClientRect();return[+((e.clientX-r.left)/r.width).toFixed(3),+((e.clientY-r.top)/r.height).toFixed(3)]};
  bd.onpointerdown=e=>{bd.setPointerCapture(e.pointerId);cur={c:bc.value,w:+bw.value,p:[pt(e)]};dS(cur)};
  bd.onpointermove=e=>{if(!cur)return;cur.p.push(pt(e));dS({...cur,p:cur.p.slice(-2)});if(cur.p.length>=790){const s=cur;cur={...s,p:[s.p[s.p.length-1]]};act({type:'stroke',s})}};
  bd.onpointerup=()=>{if(cur){const s=cur;cur=null;act({type:'stroke',s})}};
  bx.onclick=()=>{if(confirm('¿Borrar la pizarra para todos?'))act({type:'clear'})};
  async function syncBoard(){if(busy||cur)return;busy=true;try{const j=await api(`rooms/${id}/board?from=${bs.length}&v=${bv}`);if(j.reset)bs=[];bv=j.v;bs.push(...j.strokes);bd.getContext('2d').clearRect(0,0,800,500);bs.forEach(dS)}catch(x){}busy=false}
  const search=async()=>{if(!q.value.trim())return;
    if(/youtu\.?be/.test(q.value)){res.innerHTML='<small>Leyendo enlace…</small>';try{const j=await api('link?q='+encodeURIComponent(q.value.trim())),n0=R.queue.length;
      let e=await act({type:'addmany',vs:j.items});
      if(R.queue.length===n0&&n0<300){for(const v of j.items){e=await act({type:'add',v});if(e)break}}
      const n=R.queue.length-n0;
      res.innerHTML=!n&&e?`<small>No se pudo agregar: ${esc(e)}</small>`:`<small>${n>1?'Se agregaron '+n+' canciones a la cola':n===1?'Se agregó a la cola: '+esc(j.items[0].title):'No se agregó nada: la cola ya está llena'}</small>`;q.value=''}catch(x){res.textContent=x}return}
    res.innerHTML='<small>Buscando…</small>';
    try{L=await api('search?q='+encodeURIComponent(q.value));res.innerHTML=L.map((x,i)=>`<div class="rs" data-i="${i}"><img src="${thumb(x.id)}" alt=""><div><b>${esc(x.title)}</b><small>${esc(x.ch)}</small></div><button class="ghost" data-n="1" title="Reproducir ahora">▶</button></div>`).join('')||'<small>Sin resultados</small>'}catch(x){res.textContent=x}};
  sb.onclick=search;q.onkeydown=e=>{if(e.key==='Enter')search()};
  res.onclick=e=>{const d=e.target.closest('[data-i]');if(d)act({type:e.target.dataset.n?'now':'add',v:L[+d.dataset.i]})};

  await new Promise(ok=>{if(window.YT&&YT.Player)return ok();window.onYouTubeIframeAPIReady=ok;const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s)});
  P=new YT.Player('yt',{width:'100%',height:'100%',playerVars:{controls:0,disablekb:1,rel:0,playsinline:1},events:{onReady:()=>{P.setVolume(70);ready=true;paint()},onStateChange:e=>{if(e.data===0&&R&&R.idx>=0)act({type:'next',from:R.idx})}}});

  function paint(){
    if(!R||!document.getElementById('tt'))return;
    const v=R.queue[R.idx];setTheme(R.color,R.bg);setBg(R.bgm);document.title=R.emoji+' '+R.name;
    sa.style.backgroundImage=R.ia?`url(/api/img/a/${R.id}?v=${R.ia})`:'';sa.textContent=R.ia?'':R.emoji;sn.textContent=R.name;
    so.textContent=R.users.length+' en línea';so.title=R.users.join(', ');
    qn.textContent=R.queue.length+(R.queue.length===1?' canción en cola':' canciones en cola');
    tt.textContent=v?v.title:'Nada sonando';by.textContent=v?'Pedida por '+v.by:'Busca una canción y dale clic';
    dc.classList.toggle('spin',R.playing);
    const sg=JSON.stringify([R.idx,R.queue.map(x=>x.id+x.title)]);
    if(ql.dataset.g!==sg){ql.dataset.g=sg;ql.innerHTML=R.queue.map((x,i)=>`<div class="qi ${i===R.idx?'on':''}" data-i="${i}" draggable="true"><img src="${thumb(x.id)}" alt=""><span>${esc(x.title)}</span><button class="ghost" data-x="1" title="Quitar">✕</button></div>`).join('')||'<small>La cola está vacía</small>'}
    const ch=R.chat||[],lt=ch.length?ch[ch.length-1].ts:0,cg=ch.length+':'+lt;
    if(seen===null||tab==='chat')seen=lt;
    if(ping===null)ping=lt;else if(lt>ping){if(ch.some(m=>m.ts>ping&&m.u!==me()))beep();ping=lt}cbd.textContent=ch.filter(m=>m.ts>seen&&m.u!==me()).length||'';
    if(cl.dataset.g!==cg){const nb=!cl.dataset.g||cl.scrollTop+cl.clientHeight>=cl.scrollHeight-30;cl.dataset.g=cg;cl.innerHTML=ch.map(m=>`<div><b>${esc(m.u)}</b> ${esc(m.t)}</div>`).join('')||'<small>Nadie ha escrito todavía</small>';if(nb)cl.scrollTop=cl.scrollHeight}
    if(!cu_ready()){cn.value=R.name;cc.value=R.color;ce.value=R.emoji;cb.value=R.bg;bu.value=R.bgm||'';cn.dataset.s=1}
    cn.disabled=cd.hidden=fb.parentElement.hidden=fa.parentElement.hidden=bu.parentElement.hidden=R.owner!==me();
    if(R.bn!==bs.length||R.bv!==bv)syncBoard();
    if(ready){
      if(!v){if(key){P.stopVideo();key=''}return}
      const want=(R.ses||0)+v.id,p=R.pos+(R.playing?(Date.now()+off-R.at)/1000:0);
      if(key!==want){key=want;P.loadVideoById(v.id,p);if(!R.playing)setTimeout(()=>P.pauseVideo(),700)}
      else{const s=P.getPlayerState();
        if(R.playing){if(s!==1&&s!==3)P.playVideo();if(Math.abs(P.getCurrentTime()-p)>3)P.seekTo(p,true)}
        else if(s===1)P.pauseVideo()}}
    clock()}
  const cu_ready=()=>cn.dataset.s;
  function clock(){if(!R)return;const l=R.pomo.end-(Date.now()+off),m=R.pomo.mode,f=n=>String(n).padStart(2,0);
    ck.textContent=m==='idle'?'Listo para empezar':l<=0?'¡Tiempo! Cambien de fase':`${m==='work'?'Enfoque':'Descanso'} ${f(Math.floor(l/60000))}:${f(Math.floor(l/1000)%60)}`}
  const poll=async()=>{try{R=await api('rooms/'+id);off=R.now-Date.now();paint()}catch(x){if(x==='No existe')location.hash='#/'}};
  await poll();T.push(setInterval(poll,1500),setInterval(clock,500))}
</script></body></html>
